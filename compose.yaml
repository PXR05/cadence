services:
  web:
    build: .
    command: ["bun", "--bun", "run", "."]
    restart: always
    environment:
      BODY_SIZE_LIMIT: Infinity
      PROTOCOL: ${PROTOCOL}
      ORIGIN: ${PROTOCOL}://${DOMAIN}
      VITE_API_URL: ${VITE_API_URL}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
    ports:
      - "6128:3000"