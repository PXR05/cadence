services:
  web:
    image: ghcr.io/pxr05/cadence:latest
    command: [ "bun", "--bun", "run", "." ]
    restart: always
    environment:
      BODY_SIZE_LIMIT: Infinity
      PROTOCOL: ${PROTOCOL}
      ORIGIN: ${PROTOCOL}://${DOMAIN}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
    ports:
      - "6128:3000"
